<style>
  /* WeChat QR code popover — shown on hover (desktop) or tap/focus (mobile) */
  .wechat-contact { position: relative; cursor: pointer; outline: none; }
  .wechat-contact .wechat-qr {
    position: absolute;
    left: calc(100% + 12px);
    top: 50%;
    width: 240px;
    max-width: none;
    height: auto;
    padding: 6px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
    opacity: 0;
    visibility: hidden;
    transform: translate(-4px, -50%);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    z-index: 1000;
    pointer-events: none;
  }
  .wechat-contact:hover .wechat-qr,
  .wechat-contact:focus .wechat-qr,
  .wechat-contact:focus-within .wechat-qr {
    opacity: 1;
    visibility: visible;
    transform: translate(0, -50%);
  }
  /* the sidebar's transform makes it its own stacking layer; lift it above the page body */
  .sidebar { z-index: 20; }
  /* below 1200px the sidebar isn't sticky (static), so give it a position for z-index to apply */
  @media (max-width: 1199.98px) { .sidebar { position: relative; } }
  /* narrow screens: icon row at the top, so drop the card below the row, right-aligned */
  .author__urls_sm { position: relative; }
  .author__urls_sm .wechat-contact { position: static; }
  .author__urls_sm .wechat-contact .wechat-qr {
    left: auto;
    right: 0;
    top: calc(100% + 10px);
    width: 220px;
    transform: translateY(-4px);
  }
  .author__urls_sm .wechat-contact:hover .wechat-qr,
  .author__urls_sm .wechat-contact:focus .wechat-qr,
  .author__urls_sm .wechat-contact:focus-within .wechat-qr {
    transform: translateY(0);
  }

  /* GitHub star badges — styled locally, populated from GitHub's API */
  .github-stars {
    display: inline-flex;
    height: 20px;
    margin-left: 0.15em;
    overflow: hidden;
    border-radius: 3px;
    color: #fff !important;
    font-family: Verdana, "DejaVu Sans", sans-serif;
    font-size: 11px;
    line-height: 20px;
    text-decoration: none !important;
    vertical-align: text-bottom;
    white-space: nowrap;
  }
  .github-stars__label,
  .github-stars__count {
    display: inline-block;
    padding: 0 6px;
  }
  .github-stars__label { background: #555; }
  .github-stars__label i { margin-right: 4px; }
  .github-stars__count {
    min-width: 18px;
    background: #007ec6;
    text-align: center;
  }
  .github-stars:hover .github-stars__label { background: #333; }
  .github-stars:hover .github-stars__count { background: #0069a6; }
  .github-stars:focus-visible {
    outline: 2px solid #52adc8;
    outline-offset: 2px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    Array.prototype.forEach.call(document.querySelectorAll("[data-github-stars]"), function (badge) {
      var repository = badge.getAttribute("data-github-stars");
      var count = badge.querySelector(".github-stars__count");

      function markUnavailable() {
        count.textContent = "—";
        badge.setAttribute("aria-label", "GitHub star count unavailable for " + repository);
      }

      if (!window.fetch) {
        markUnavailable();
        return;
      }

      window.fetch("https://api.github.com/repos/" + repository, {
        headers: { "Accept": "application/vnd.github+json" }
      }).then(function (response) {
        if (!response.ok) {
          markUnavailable();
          return null;
        }
        return response.json();
      }).then(function (data) {
        if (!data || typeof data.stargazers_count !== "number") {
          markUnavailable();
          return;
        }

        var formattedCount = data.stargazers_count.toLocaleString("en-US");
        count.textContent = formattedCount;
        badge.setAttribute("aria-label", repository + " has " + formattedCount + " GitHub stars");
      }, markUnavailable);
    });
  });
</script>
